services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: besnap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: besnap
      POSTGRES_USER: besnap
      POSTGRES_PASSWORD: besnap
    ports:
      - "5432:5432"
    volumes:
      - besnap_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: besnap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: besnap-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: besnap
      MINIO_ROOT_PASSWORD: besnapsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - besnap_minio:/data

volumes:
  besnap_pg:
  besnap_minio:
